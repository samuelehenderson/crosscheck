name: Refresh rosters

# Pulls current rosters from the NHL feed and commits them, so the deployed
# site stays up to date even if Vercel's serverless IPs are blocked by the NHL
# API. Runs on a schedule and can be triggered manually.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rosters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh rosters, ratings, stats, injuries & free agents
        run: node scripts/refresh-data.mjs
      - name: Fetch X wire (needs X_BEARER_TOKEN secret)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_WIRE_QUERY: ${{ secrets.X_WIRE_QUERY }}
        run: node scripts/fetch-wire.mjs
        continue-on-error: true
      - name: Fetch news wire (RSS, no key needed)
        run: node scripts/fetch-news.mjs
        continue-on-error: true
      - name: Commit refreshed rosters
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            # Author as the repo owner (their GitHub noreply address) so Vercel
            # attributes the commit to the connected account — commits from an
            # unrecognized bot author get "Blocked" and never deploy.
            git config user.name "samuelehenderson"
            git config user.email "268289926+samuelehenderson@users.noreply.github.com"
            git add src/data/*.json public/updatedAt.json
            git commit -m "chore: refresh rosters, stats, injuries & free agents"
            git push
            echo "Committed refreshed rosters."
          else
            echo "No roster changes to commit."
          fi
      - name: Trigger Vercel deploy hook (if configured)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret set — relying on Vercel's Git integration."
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook.out -w "%{http_code}" --max-time 20 -X POST "$HOOK" || echo "000")
          echo "Deploy hook responded HTTP $code"
          if grep -q '"job"' /tmp/hook.out 2>/dev/null; then
            echo "Vercel accepted the deploy request — a fresh build is starting."
          else
            echo "WARNING: response did not look like a Vercel deploy-hook payload."
            echo "The secret should be the Deploy Hook URL from Vercel → Settings → Git → Deploy Hooks"
            echo "(it starts with https://api.vercel.com/v1/integrations/deploy/...), not the site URL."
          fi
