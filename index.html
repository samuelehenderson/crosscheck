<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('pp.theme') === 'light')
          document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
    <title>IceMetrix — NHL Rosters, Trades &amp; Contracts</title>
    <meta
      name="description"
      content="Build trades, sign free agents, project contracts, and watch projections move for all 32 NHL teams — with live rosters, stats, and injuries."
    />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#090e12" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IceMetrix" />

    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IceMetrix — NHL Rosters, Trades &amp; Contracts" />
    <meta
      property="og:description"
      content="Build trades, sign free agents, project contracts, and watch projections move for all 32 NHL teams — with live rosters, stats, and injuries."
    />
    <meta property="og:url" content="https://icemetricstemp.vercel.app/" />
    <meta property="og:image" content="https://icemetricstemp.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IceMetrix — NHL Rosters, Trades &amp; Contracts" />
    <meta
      name="twitter:description"
      content="Build trades, sign free agents, project contracts, and watch projections move for all 32 NHL teams."
    />
    <meta name="twitter:image" content="https://icemetricstemp.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
